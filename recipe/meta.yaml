{% set version = "6.1.0" %}

package:
    name: esys-escript
    version: {{ version }}
source:
    url: https://github.com/LutzGross/esys-escript.github.io/archive/refs/tags/{{ version }}.tar.gz
    sha256: 2ffb246b00c68f61de4f21bf918e14334acdc4e46263a47bc24313d17fc67926
    patches:
        - 0001-anaconda-options-drop-import-os.patch
        - 0002-openmp-signed-loop-counters.patch
        - 0003-uint-to-unsigned-int.patch
        - 0004-and-to-andand.patch
        - 0005-explicit-complex-template-arg.patch
        - 0006-windows-posix-guards.patch
        - 0007-pyd-no-escript-exports.patch
        - 0008-numpy-include-discovery.patch
        - 0009-skip-pythonmpi-pyd-without-mpi4py.patch
        - 0010-write-launcher-before-sconscript.patch
        - 0011-diagnose-boost-numpy-failure.patch
        - 0012-boost-numpy-libs-list.patch
        - 0013-mumps-mpi-header-probe.patch
        - 0014-undef-mpi-comm-world-before-mumps.patch
        - 0015-split-ld-extra-string.patch
        - 0016-raw-string-gmsh-templates.patch
        - 0017-rpath-for-libesys.patch
build:
    number: 0
requirements:
    build:
        - {{ compiler('cxx') }}
        - {{ compiler('fortran') }}
        - {{ stdlib("c") }}
        - scons
        - cmake
        - make
        - python
        - setuptools
        - numpy
        - git
    host:
        - libboost-devel
        - libboost-python-devel
        - numpy
        - python
        - setuptools
        - matplotlib-base
        - hdf5
        - libopenblas  # [unix]
        - llvm-openmp  # [unix]
        - openmp  # [win]
        - scipy
        - sympy
        - libumfpack
        - mumps-seq
        - gmsh  # [win]
    run:
        - python
        - matplotlib-base
        - llvm-openmp  # [unix]
        - openmp  # [win]
        - hdf5
        - scipy
        - sympy
        - gmsh  # [win]
        - setuptools  # [py>=312]
test:
    commands:
        - run-escript -c
        - run-escript /tmp/release_sanity.py  # [linux]
        - run-escript %TEMP%/release_sanity.py  # [win]
about:
    home: https://github.com/LutzGross/esys-escript.github.io
    summary: esys-escript is a programming tool for implementing mathematical
        models in python using the finite element method (FEM).
    license: Apache-2.0
    license_file: LICENSE
    description: esys-escript is a programming tool for implementing
        mathematical models in python using the finite element method (FEM).
        As users do not access the data structures it is very easy to use and
        scripts can run on desktop computers as well as highly parallel
        supercomputer without changes. Application areas for escript include
        earth mantle convection, geophysical inversion, earthquakes,
        porous media flow, reactive transport, plate subduction, erosion,
        and tsunamis.
    dev_url: https://github.com/LutzGross/esys-escript.github.io
    doc_url: https://lutzgross.github.io/esys-escript.github.io/

extra:
    recipe-maintainers:
        - esys-escript
