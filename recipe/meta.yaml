{% set version = "6.1.1" %}

package:
    name: esys-escript
    version: {{ version }}
source:
    url: https://github.com/LutzGross/esys-escript.github.io/archive/refs/tags/{{ version }}.tar.gz
    sha256: 5b84c1dfa555f891d77b1d5d9765f9ffb668e80ca33acd226b605ae0d62782d1
    patches:
        # macOS: link extensions with -undefined dynamic_lookup instead of
        # libpython -> fixes the boost.python import segfault
        # (conda-forge/boost-feedstock#266). Upstream in escript master;
        # carried here until the next escript release.
        - 0001-osx-python-dynamic-lookup.patch
build:
    number: 0
requirements:
    build:
        - {{ compiler('cxx') }}
        - {{ compiler('fortran') }}
        - {{ stdlib("c") }}
        - scons
        - cmake
        - make
        - python
        - setuptools
        - numpy
        - git
    host:
        - libboost-devel
        - libboost-python-devel
        - numpy
        - python
        - setuptools
        - matplotlib-base
        - hdf5
        - libopenblas  # [unix]
        - llvm-openmp  # [unix]
        - openmp  # [win]
        - scipy
        - sympy
        - libumfpack
        - mumps-seq
        - gmsh  # [win]
    run:
        - python
        - matplotlib-base
        - llvm-openmp  # [unix]
        - openmp  # [win]
        - hdf5
        - scipy
        - sympy
        - gmsh  # [win]
        - setuptools  # [py>=312]
test:
    commands:
        - run-escript -c
        # Use the plain interpreter (not run-escript) so this guards the
        # design goal: bare `import esys` must work without run-escript
        # setting LD_LIBRARY_PATH/PYTHONPATH (relies on RPATH + site-packages).
        - python /tmp/release_sanity.py  # [unix]
        - python %TEMP%/release_sanity.py  # [win]
about:
    home: https://github.com/LutzGross/esys-escript.github.io
    summary: esys-escript is a programming tool for implementing mathematical
        models in python using the finite element method (FEM).
    license: Apache-2.0
    license_file: LICENSE
    description: esys-escript is a programming tool for implementing
        mathematical models in python using the finite element method (FEM).
        As users do not access the data structures it is very easy to use and
        scripts can run on desktop computers as well as highly parallel
        supercomputer without changes. Application areas for escript include
        earth mantle convection, geophysical inversion, earthquakes,
        porous media flow, reactive transport, plate subduction, erosion,
        and tsunamis.
    dev_url: https://github.com/LutzGross/esys-escript.github.io
    doc_url: https://lutzgross.github.io/esys-escript.github.io/

extra:
    recipe-maintainers:
        - esys-escript
