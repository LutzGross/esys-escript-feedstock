{% set version = "6.1.0" %}

package:
    name: esys-escript
    version: {{ version }}
source:
    url: https://github.com/LutzGross/esys-escript.github.io/archive/refs/tags/{{ version }}.tar.gz
    sha256: 2ffb246b00c68f61de4f21bf918e14334acdc4e46263a47bc24313d17fc67926
    patches:
        - 0001-anaconda-options-drop-import-os.patch
        - 0002-openmp-signed-loop-counters.patch
        - 0003-uint-to-unsigned-int.patch
        - 0004-and-to-andand.patch
        - 0005-explicit-complex-template-arg.patch
        - 0006-windows-posix-guards.patch
        - 0007-pyd-no-escript-exports.patch
        - 0008-numpy-include-discovery.patch
        - 0009-skip-pythonmpi-pyd-without-mpi4py.patch
        - 0010-write-launcher-before-sconscript.patch
        - 0011-diagnose-boost-numpy-failure.patch
        - 0012-boost-numpy-libs-list.patch
        - 0013-mumps-mpi-header-probe.patch
        - 0014-undef-mpi-comm-world-before-mumps.patch
        - 0015-split-ld-extra-string.patch
        - 0016-raw-string-gmsh-templates.patch
        - 0017-rpath-for-libesys.patch
        - 0018-also-rpath-prefix-lib.patch
        - 0019-drop-duplicate-rpath-shlinkflags.patch
        - 0020-fix-warnings-speckley-and-acos.patch
        - 0021-fix-msvc-narrowing-warnings.patch
        - 0022-pip-bootstrap-only-with-esys-escript-lib.patch
build:
    number: 0
requirements:
    build:
        - {{ compiler('cxx') }}
        - {{ compiler('fortran') }}
        - {{ stdlib("c") }}
        # libboost-python 1.88 was built against libcxx 19; the build env
        # otherwise pulls libcxx 22, so escript + boost.python consumers get
        # compiled against libcxx-22 headers while libboost_python.dylib is
        # libcxx-19 -- the std::type_info/registry skew that nulls the int
        # converter (see host note). Pin the COMPILE-time libc++ to match.
        - libcxx <20  # [osx]
        - scons
        - cmake
        - make
        - python
        - setuptools
        - numpy
        - git
    host:
        - libboost-devel
        - libboost-python-devel
        # osx-64 resolves libcxx 22 while the toolchain is clang 19 and
        # libboost-python 1.88 was built against an older libc++. That libc++
        # ABI skew corrupts boost.python's converter registry: importing ANY
        # boost.python module with an int default-arg segfaults (proven with a
        # trivial 5-line probe, build 1533409). Pin libcxx to the clang-19
        # series so the build links a compatible libc++.
        - libcxx <20  # [osx]
        - numpy
        - python
        - setuptools
        - matplotlib-base
        - hdf5
        - libopenblas  # [unix]
        - llvm-openmp  # [unix]
        - openmp  # [win]
        - scipy
        - sympy
        - libumfpack
        - mumps-seq
        - gmsh  # [win]
    run:
        - python
        - matplotlib-base
        - libcxx <20  # [osx]  -- keep runtime libc++ on the clang-19 ABI (see host note)
        - llvm-openmp  # [unix]
        - openmp  # [win]
        - hdf5
        - scipy
        - sympy
        - gmsh  # [win]
        - setuptools  # [py>=312]
test:
    commands:
        - run-escript -c
        # Use the plain interpreter (not run-escript) so this guards the
        # design goal: bare `import esys` must work without run-escript
        # setting LD_LIBRARY_PATH/PYTHONPATH (relies on RPATH + site-packages).
        - python /tmp/release_sanity.py  # [linux]
        # osx segfaults in create_module while loading escriptcpp.so (C++ static
        # init / PyInit, faulthandler bottoms out there). Probe the core extension
        # first; on crash sleep (ReportCrash writes the .ips asynchronously) then
        # dump the newest DiagnosticReports/*.ips so CI names the crashing library
        # + symbol. NOTE: do NOT use lldb here -- it cannot attach on the headless
        # CI and hangs the job to the 6h Azure timeout.
        - 'python -X faulthandler -c "import esys.escriptcore.escriptcpp" && python -X faulthandler /tmp/release_sanity.py || { echo "=== waiting for ReportCrash (.ips) ==="; sleep 25; echo "=== DiagnosticReports listing ==="; ls -lat ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -20; f=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1); echo "newest crash report: $f"; head -250 "$f" 2>/dev/null || echo "(no .ips crash report found)"; false; }'  # [osx]
        - python %TEMP%/release_sanity.py  # [win]
about:
    home: https://github.com/LutzGross/esys-escript.github.io
    summary: esys-escript is a programming tool for implementing mathematical
        models in python using the finite element method (FEM).
    license: Apache-2.0
    license_file: LICENSE
    description: esys-escript is a programming tool for implementing
        mathematical models in python using the finite element method (FEM).
        As users do not access the data structures it is very easy to use and
        scripts can run on desktop computers as well as highly parallel
        supercomputer without changes. Application areas for escript include
        earth mantle convection, geophysical inversion, earthquakes,
        porous media flow, reactive transport, plate subduction, erosion,
        and tsunamis.
    dev_url: https://github.com/LutzGross/esys-escript.github.io
    doc_url: https://lutzgross.github.io/esys-escript.github.io/

extra:
    recipe-maintainers:
        - esys-escript
